<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar Akun | WibuzoneVerse</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="auth.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="auth-container">
        <h2>📝 Daftar Akun Baru</h2>
        <div id="alert-box" class="alert"></div>

        <!-- Form Data Diri -->
        <form id="register-form">
            <div class="input-group">
                <i class="fa-solid fa-user"></i>
                <input type="text" id="nama" placeholder="Nama Lengkap" required>
            </div>
            <div class="input-group">
                <i class="fa-solid fa-envelope"></i>
                <input type="email" id="email" placeholder="Alamat Email" required>
            </div>
            <div class="input-group">
                <i class="fa-solid fa-phone"></i>
                <input type="tel" id="hp" placeholder="Nomor HP (08xxx)" required>
            </div>
            <div class="input-group">
                <i class="fa-solid fa-lock"></i>
                <input type="password" id="password" placeholder="Kata Sandi" required>
            </div>

            <button type="button" id="kirim-otp-btn" class="btn">Kirim Kode OTP</button>

            <!-- Bagian OTP -->
            <div class="otp-section" id="otp-area">
                <div class="input-group">
                    <i class="fa-solid fa-key"></i>
                    <input type="text" id="kode-otp" placeholder="Masukkan Kode OTP" maxlength="6" required>
                </div>
                <button type="submit" class="btn">Verifikasi & Daftar</button>
            </div>
        </form>

        <div class="switch-page">
            Sudah punya akun? <a href="login.html">Masuk di sini</a>
        </div>
    </div>

        <script src="./auth.js"></script>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <script>
        // ✅ KUNCI YANG BENAR
        (function(){
            emailjs.init({
                publicKey: "PNLaNf9VhbdWwlbBeRM7J",
            });
        })();
    </script>

</body>
</html>
